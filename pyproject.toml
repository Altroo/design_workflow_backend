[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
extend_skip = ["migrations", ".tmp"]

[tool.black]
target-version = ["py314"]
extend-exclude = '/(migrations|\.tmp)/'

[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations", ".tmp", "static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "UP"]
