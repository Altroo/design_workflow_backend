# Include inside the design-workflow-api.elbouazzatiholding.ma server block.
# Store as a .inc file when using conf.d/*.conf to avoid loading at http scope.
# Django accepts 10 GiB per file; leave space for multipart fields.
# Requires the Uvicorn web container; Daphne buffers the entire body in RAM.
# Timeouts measure inactivity, not total upload duration.
client_max_body_size 11G;
client_body_timeout 600s;
